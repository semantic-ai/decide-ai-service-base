[project]
name = "decide-ai-service-base"
version = "0.3.4"
description = "Base package for implementing AI services in the template for the DECIDe project"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
    "fastapi==0.121.1",
    "PyYAML==6.0.3",
    "pydantic-settings==2.15.0",
    "requests==2.34.2",
]
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "freezegun==1.5.5",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
